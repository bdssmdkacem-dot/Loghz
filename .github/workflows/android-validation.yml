name: Android bundle validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/premium-visual-refresh"]
jobs:
  export-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate project data and assets
        run: npm run validate
      - name: Check Expo configuration
        run: npx expo config --type public
      - name: Bundle Android JavaScript
        run: npx expo export --platform android --output-dir dist
